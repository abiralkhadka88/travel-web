image: atlassian/default-image:2
pipelines:
  branches:
    develop:
      - step:
          name: Build app and generate static files
          caches:
            - node
          image: node:20-slim
          script:
            - npm install
            - unset CI
            - while true; do date && echo "Memory usage in megabytes:" && echo $((`cat /sys/fs/cgroup/memory/memory.memsw.usage_in_bytes | awk '{print $1}'`/1048576)) && echo "" && sleep 5; done &
            - npm run build
          artifacts:
            - dist/**

      - step:
          name: Deploy to development S3 bucket
          script:
            - pipe: atlassian/aws-s3-deploy:0.3.8
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
                S3_BUCKET: $S3_BUCKET
                LOCAL_PATH: "dist"
                ACL: "private"
                CACHE_CONTROL: "max-age=0,no-cache,no-store,must-revalidate"
                DELETE_FLAG: "true"
      - step:
          name: Cloudfront Distribution Invalidation
          script:
            - pipe: atlassian/aws-cloudfront-invalidate:0.6.0
              variables:
                AWS_ACCESS_KEY_ID: $AWS_ACCESS_KEY_ID
                AWS_SECRET_ACCESS_KEY: $AWS_SECRET_ACCESS_KEY
                AWS_DEFAULT_REGION: $AWS_DEFAULT_REGION
                DISTRIBUTION_ID: $DISTRIBUTION_ID
